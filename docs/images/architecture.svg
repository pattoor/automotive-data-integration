<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="840" viewBox="0 0 1600 840" role="img" aria-labelledby="title desc">
  <title id="title">Automotive Data Integration architecture</title>
  <desc id="desc">n8n triggers the pipeline API, which extracts paginated data from the mock CRM API, validates it, and persists entities, runs, and rejections to PostgreSQL.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', Inter, Arial, sans-serif; font-size: 34px; font-weight: 700; fill: #f8fafc; }
    .subtitle { font-family: 'Segoe UI', Inter, Arial, sans-serif; font-size: 17px; font-weight: 400; fill: #94a3b8; }
    .h { font-family: 'Segoe UI', Inter, Arial, sans-serif; font-size: 22px; font-weight: 700; fill: #f1f5f9; }
    .h-small { font-family: 'Segoe UI', Inter, Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #f1f5f9; }
    .body { font-family: 'Segoe UI', Inter, Arial, sans-serif; font-size: 15px; font-weight: 400; fill: #e2e8f0; }
    .step { font-family: 'Segoe UI', Inter, Arial, sans-serif; font-size: 16px; font-weight: 600; fill: #e2e8f0; }
    .note { font-family: 'Segoe UI', Inter, Arial, sans-serif; font-size: 12.5px; font-weight: 400; fill: #94a3b8; }
    .mono { font-family: 'Cascadia Code', Consolas, 'Courier New', monospace; font-size: 14px; font-weight: 400; fill: #cbd5e1; }
    .stepnum { font-family: 'Segoe UI', Inter, Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #38bdf8; }
    .arrowlabel { font-family: 'Segoe UI', Inter, Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #94a3b8; }
    .footer { font-family: 'Segoe UI', Inter, Arial, sans-serif; font-size: 13.5px; font-weight: 400; fill: #94a3b8; }
    .panel { fill: #111c31; stroke: #24344f; stroke-width: 1.5; }
    .divider { stroke: #1e2b45; stroke-width: 1; }
    .arrow { stroke: #64748b; stroke-width: 2; fill: none; }
    .arrow-dashed { stroke: #475569; stroke-width: 2; fill: none; stroke-dasharray: 6 6; }
  </style>

  <rect width="1600" height="840" fill="#0b1220"/>
  <rect x="0" y="0" width="1600" height="4" fill="#38bdf8"/>

  <text x="60" y="74" class="title">Automotive Data Integration</text>
  <text x="60" y="106" class="subtitle">A mock dealership CRM, a validating ETL pipeline, and idempotent persistence on one Docker Compose host</text>
  <line x1="60" y1="132" x2="1540" y2="132" class="divider"/>

  <!-- n8n -->
  <rect x="60" y="180" width="300" height="230" rx="18" class="panel"/>
  <circle cx="86" cy="210" r="5" fill="#fbbf24"/>
  <text x="102" y="217" class="h">n8n</text>
  <text x="86" y="246" class="note">orchestration only</text>
  <line x1="86" y1="260" x2="334" y2="260" class="divider"/>
  <text x="86" y="288" class="body">Manual Trigger</text>
  <text x="86" y="307" class="note">human-started run</text>
  <text x="86" y="339" class="body">Schedule Trigger</text>
  <text x="86" y="358" class="note">daily, 09:00 UTC - inactive by design</text>
  <text x="86" y="391" class="note">One HTTP Request node. No ETL logic.</text>

  <!-- pipeline-api -->
  <rect x="480" y="160" width="520" height="470" rx="18" class="panel"/>
  <circle cx="506" cy="190" r="5" fill="#38bdf8"/>
  <text x="522" y="197" class="h">pipeline-api</text>
  <text x="506" y="224" class="note">FastAPI - extraction, validation and persistence</text>
  <line x1="506" y1="240" x2="974" y2="240" class="divider"/>

  <circle cx="512" cy="276" r="11" fill="#0e1a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="512" y="281" text-anchor="middle" class="stepnum">1</text>
  <text x="536" y="276" class="step">Extract every page</text>
  <text x="536" y="294" class="note">httpx - bounded page size, follow next_page</text>

  <circle cx="512" cy="320" r="11" fill="#0e1a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="512" y="325" text-anchor="middle" class="stepnum">2</text>
  <text x="536" y="320" class="step">Normalize and deduplicate</text>
  <text x="536" y="338" class="note">Pandas batch pass - first valid row wins</text>

  <circle cx="512" cy="364" r="11" fill="#0e1a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="512" y="369" text-anchor="middle" class="stepnum">3</text>
  <text x="536" y="364" class="step">Validate each record</text>
  <text x="536" y="382" class="note">Pydantic - exact reason per rejected row</text>

  <circle cx="512" cy="408" r="11" fill="#0e1a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="512" y="413" text-anchor="middle" class="stepnum">4</text>
  <text x="536" y="408" class="step">Resolve relationships</text>
  <text x="536" y="426" class="note">vehicle needs a customer, sale needs both</text>

  <circle cx="512" cy="452" r="11" fill="#0e1a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="512" y="457" text-anchor="middle" class="stepnum">5</text>
  <text x="536" y="452" class="step">Upsert accepted entities</text>
  <text x="536" y="470" class="note">parents first - INSERT ON CONFLICT crm_id</text>

  <circle cx="512" cy="496" r="11" fill="#0e1a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="512" y="501" text-anchor="middle" class="stepnum">6</text>
  <text x="536" y="496" class="step">Finalize the run</text>
  <text x="536" y="514" class="note">succeeded / failed with fetched, accepted, rejected, duplicate</text>

  <text x="506" y="562" class="note">POST /pipeline/runs is synchronous and returns the run summary.</text>
  <text x="506" y="584" class="note">Rejections keep the exact raw payload and the failing reason.</text>

  <!-- crm-api -->
  <rect x="1140" y="160" width="400" height="200" rx="18" class="panel"/>
  <circle cx="1166" cy="190" r="5" fill="#a78bfa"/>
  <text x="1182" y="197" class="h">crm-api</text>
  <text x="1166" y="224" class="note">synthetic source - FastAPI</text>
  <line x1="1166" y1="240" x2="1514" y2="240" class="divider"/>
  <text x="1166" y="270" class="body">Deterministic customers, vehicles, sales</text>
  <text x="1166" y="296" class="note">Paginated REST: page / page_size / next_page</text>
  <text x="1166" y="320" class="note">Deliberate malformed and duplicate rows</text>
  <text x="1166" y="344" class="note">Read-only, no database</text>

  <!-- postgres -->
  <rect x="1140" y="410" width="400" height="280" rx="18" class="panel"/>
  <circle cx="1166" cy="440" r="5" fill="#34d399"/>
  <text x="1182" y="447" class="h">PostgreSQL 16</text>
  <text x="1166" y="474" class="note">persistence - direct SQL, no ORM</text>
  <line x1="1166" y1="490" x2="1514" y2="490" class="divider"/>
  <rect x="1166" y="504" width="132" height="26" rx="6" fill="#0e1a2e" stroke="#1e2b45"/>
  <text x="1178" y="522" class="mono">customers</text>
  <rect x="1310" y="504" width="132" height="26" rx="6" fill="#0e1a2e" stroke="#1e2b45"/>
  <text x="1322" y="522" class="mono">vehicles</text>
  <rect x="1166" y="538" width="132" height="26" rx="6" fill="#0e1a2e" stroke="#1e2b45"/>
  <text x="1178" y="556" class="mono">sales</text>
  <rect x="1310" y="538" width="142" height="26" rx="6" fill="#0e1a2e" stroke="#1e2b45"/>
  <text x="1322" y="556" class="mono">pipeline_runs</text>
  <rect x="1166" y="572" width="276" height="26" rx="6" fill="#0e1a2e" stroke="#1e2b45"/>
  <text x="1178" y="590" class="mono">rejected_records</text>
  <text x="1166" y="626" class="note">unique crm_id - foreign keys - NUMERIC(12,2)</text>
  <text x="1166" y="650" class="note">One row per entity and per run.</text>

  <!-- GitHub Actions -->
  <rect x="60" y="470" width="300" height="130" rx="18" class="panel"/>
  <circle cx="86" cy="498" r="5" fill="#f472b6"/>
  <text x="102" y="504" class="h-small">GitHub Actions</text>
  <text x="86" y="532" class="note">host tests + pip check</text>
  <text x="86" y="554" class="note">Compose build + live smoke test</text>
  <text x="86" y="576" class="note">runs on push and PRs</text>

  <!-- arrows -->
  <line x1="360" y1="310" x2="476" y2="310" class="arrow" marker-end="url(#arrow)"/>
  <text x="420" y="296" text-anchor="middle" class="arrowlabel">POST /pipeline/runs</text>

  <line x1="1000" y1="240" x2="1136" y2="240" class="arrow" marker-end="url(#arrow)"/>
  <text x="1070" y="226" text-anchor="middle" class="arrowlabel">GET collections</text>
  <text x="1070" y="262" text-anchor="middle" class="note">paginated</text>

  <line x1="1000" y1="500" x2="1136" y2="500" class="arrow" marker-end="url(#arrow)"/>
  <text x="1070" y="486" text-anchor="middle" class="arrowlabel">UPSERT</text>
  <text x="1070" y="522" text-anchor="middle" class="note">parents first</text>

  <line x1="360" y1="535" x2="476" y2="535" class="arrow-dashed" marker-end="url(#arrow-dim)"/>
  <text x="420" y="521" text-anchor="middle" class="arrowlabel">build + smoke</text>

  <!-- footer -->
  <text x="60" y="740" class="footer">Single-host Docker Compose  -  loopback-only ports  -  bind-mounted data  -  idempotent reruns</text>
  <text x="60" y="770" class="note">Synthetic dealership data only. No real customer information, credentials, or commercial systems.</text>
</svg>
