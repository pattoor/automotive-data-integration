name: automotive-data-integration

# Liveness probe shared by both FastAPI services (no curl needed in the image).
x-app-healthcheck: &app-healthcheck
  test:
    - CMD
    - python
    - -c
    - import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=3)
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 5s

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-automotive}
      POSTGRES_USER: ${POSTGRES_USER:-automotive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-automotive-local-dev}
    volumes:
      # Bind mount, not a named volume: persistent project data stays visible
      # under the G7 project folder instead of Docker's daemon-wide storage.
      - type: bind
        source: ./.data/postgres
        target: /var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  crm-api:
    image: automotive-data-integration:local
    build:
      context: .
    command: ["crm-api"]
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: "8000"
    ports:
      - "127.0.0.1:${CRM_API_PORT:-8000}:8000"
    healthcheck: *app-healthcheck
    restart: unless-stopped

  pipeline-api:
    image: automotive-data-integration:local
    build:
      context: .
    command: ["pipeline-api"]
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: "8000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-automotive}:${POSTGRES_PASSWORD:-automotive-local-dev}@postgres:5432/${POSTGRES_DB:-automotive}
    ports:
      - "127.0.0.1:${PIPELINE_API_PORT:-8001}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck: *app-healthcheck
    restart: unless-stopped
