name: automotive-data-integration

# Liveness probe shared by both FastAPI services (no curl needed in the image).
x-app-healthcheck: &app-healthcheck
  test:
    - CMD
    - python
    - -c
    - import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=3)
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 5s

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-automotive}
      POSTGRES_USER: ${POSTGRES_USER:-automotive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-automotive-local-dev}
    volumes:
      # Bind mount, not a named volume: persistent project data stays visible
      # under the G7 project folder instead of Docker's daemon-wide storage.
      - type: bind
        source: ./.data/postgres
        target: /var/lib/postgresql/data
      # Applied only when the data directory is empty (first initialization).
      # pipeline-api also applies it at startup for already-initialized data.
      - type: bind
        source: ./database/schema.sql
        target: /docker-entrypoint-initdb.d/001_schema.sql
        read_only: true
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  crm-api:
    image: automotive-data-integration:local
    build:
      context: .
    command: ["crm-api"]
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: "8000"
    ports:
      - "127.0.0.1:${CRM_API_PORT:-8000}:8000"
    healthcheck: *app-healthcheck
    restart: unless-stopped

  pipeline-api:
    image: automotive-data-integration:local
    build:
      context: .
    command: ["pipeline-api"]
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: "8000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-automotive}:${POSTGRES_PASSWORD:-automotive-local-dev}@postgres:5432/${POSTGRES_DB:-automotive}
      CRM_BASE_URL: ${CRM_BASE_URL:-http://crm-api:8000}
      CRM_PAGE_SIZE: ${CRM_PAGE_SIZE:-3}
    ports:
      - "127.0.0.1:${PIPELINE_API_PORT:-8001}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      crm-api:
        condition: service_healthy
    healthcheck: *app-healthcheck
    restart: unless-stopped

  n8n:
    # Pinned to the official release verified on 2026-11-13.
    image: n8nio/n8n:2.47.7
    environment:
      # Loopback-only demo: the editor is published on 127.0.0.1 below, so the
      # session cookie must not require HTTPS.
      N8N_HOST: 127.0.0.1
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      N8N_LISTEN_ADDRESS: 0.0.0.0
      N8N_SECURE_COOKIE: "false"
      # Schedules are evaluated in UTC, so "daily 09:00" means 09:00 UTC.
      GENERIC_TIMEZONE: UTC
      TZ: UTC
      # No telemetry, product personalization, or update calls.
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
    volumes:
      # Bind mount, not a named volume: n8n state (SQLite database, encryption
      # key, user settings) stays under the project folder.
      - type: bind
        source: ./n8n/data
        target: /home/node/.n8n
      # Versioned workflow export, read-only, imported through the UI.
      - type: bind
        source: ./n8n/workflows
        target: /workflows
        read_only: true
    ports:
      # Host-side port only; the container always listens on 5678.
      - "127.0.0.1:${N8N_UI_PORT:-5678}:5678"
    depends_on:
      pipeline-api:
        condition: service_healthy
    restart: unless-stopped
